<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="header">
            <div class="score-box">
                <span>SCORE</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span>HIGH SCORE</span>
                <span id="high-score">0</span>
            </div>
        </div>
        
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="448" height="496"></canvas>
            
            <div id="start-screen" class="overlay active">
                <h1 class="title" style="color: yellow; text-shadow: 2px 2px #000;">PAC-MAN</h1>
                <p class="blink">Pressione ESPAÇO para Iniciar</p>
                <div class="controls" style="margin-top: 30px; font-size: 10px; line-height: 1.5; color: #aaa;">
                    Controles: Setas do Teclado<br>
                    Coma todos os pontos para vencer!
                </div>
            </div>
            
            <div id="game-over-screen" class="overlay">
                <h2 class="title" style="color: #ff0000; text-shadow: 2px 2px #000;">GAME OVER</h2>
                <p>Pontuação Final: <span id="final-score">0</span></p>
                <button id="restart-btn">Tentar Novamente</button>
            </div>
            
            <div id="win-screen" class="overlay">
                <h2 class="title" style="color: #00ff00; text-shadow: 2px 2px #000;">YOU WIN!</h2>
                <p>Pontuação: <span id="win-score">0</span></p>
                <button id="next-level-btn">Jogar Novamente</button>
            </div>
        </div>
        
        <div id="footer">
            <div class="lives" id="lives-container">
                <!-- Vidas -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

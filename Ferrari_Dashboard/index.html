<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scuderia Ferrari - Legacy Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d1/Ferrari-Logo.svg/1200px-Ferrari-Logo.svg.png" alt="Ferrari Logo">
            <span>FERRARI LEGACY</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>PURA EMOZIONE</h1>
            <p>A história, o design e a performance dos carros mais cobiçados do mundo.</p>
            <a href="#timeline" class="btn-primary">EXPLORAR LINHA DO TEMPO</a>
        </div>
    </header>

    <main>
        <section id="timeline" class="timeline-section">
            <div class="section-title">
                <h2>A LINHA DO TEMPO</h2>
                <div class="divider"></div>
            </div>
            <div class="timeline-container" id="timelineContainer">
                <!-- Injetado via JS -->
            </div>
        </section>

        <section id="mural" class="mural-section">
            <div class="section-title">
                <h2>MURAL DE MÁQUINAS</h2>
                <div class="divider"></div>
            </div>
            <div class="mural-grid" id="muralGrid">
                <!-- Injetado via JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Scuderia Ferrari Fan Dashboard - OpenClaw Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exitos Info - Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="background-animation">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                    <span>EXITOS INFO</span>
                </div>
                <h2>Cadastro de Cliente</h2>
                <p>Registre seus dados para soluções completas de TI.</p>
            </div>
            
            <form id="registrationForm" class="registration-form">
                
                <div class="form-section">
                    <h3><i class="fas fa-user"></i> Informações Pessoais</h3>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="fullName">Nome Completo</label>
                            <input type="text" id="fullName" placeholder="Ex: João da Silva" required>
                        </div>
                        <div class="input-field">
                            <label for="cpf">CPF / CNPJ</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-envelope"></i> Contato</h3>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" placeholder="contato@exemplo.com" required>
                        </div>
                        <div class="input-field">
                            <label for="phone">Telefone / WhatsApp</label>
                            <input type="tel" id="phone" placeholder="(00) 00000-0000" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-desktop"></i> Serviço de Interesse</h3>
                    <div class="input-field full-width">
                        <label for="serviceType">Selecione o serviço</label>
                        <select id="serviceType" required>
                            <option value="" disabled selected>Escolha uma opção...</option>
                            <option value="manutencao">Manutenção de Computadores/Notebooks</option>
                            <option value="redes">Infraestrutura e Redes</option>
                            <option value="software">Desenvolvimento de Software</option>
                            <option value="consultoria">Consultoria em TI</option>
                            <option value="servidores">Gestão de Servidores</option>
                        </select>
                    </div>
                    
                    <div class="input-field full-width">
                        <label for="message">Observações adicionais</label>
                        <textarea id="message" rows="4" placeholder="Descreva brevemente o problema ou projeto..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">
                        <span>Concluir Cadastro</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <div id="successMessage" class="success-message hidden">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h3>Cadastro Realizado!</h3>
                <p>Seus dados foram enviados para o sistema Exitos Info. Entraremos em contato em breve.</p>
                <button id="resetBtn" class="reset-btn">Novo Cadastro</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
